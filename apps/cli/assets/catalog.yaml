  openssh:
    description: SSH server and client
    descriptionDE: "SSH-Server und -Client"
    descriptionES: "Servidor y cliente SSH"
    descriptionIT: "Server e client SSH"
    descriptionFR: "Serveur et client SSH"
    category: Networking
    file: openssh.sh
    sudo:
    os_family:
    - debian
    - redhat
    - arch
    - suse
    - alpine
    actions:
    - name: install
      parameter: install
      description: Install and enable SSH
      descriptionDE: "SSH installieren und aktivieren"
      descriptionES: "Instalar y activar SSH"
      descriptionIT: "Installa e attiva SSH"
      descriptionFR: "Installer et activer SSH"
    - name: update
      parameter: update
      description: Update SSH
      descriptionDE: "SSH aktualisieren"
      descriptionES: "Actualizar SSH"
      descriptionIT: "Aggiorna SSH"
      descriptionFR: "Mettre à jour SSH"
    - name: uninstall
      parameter: uninstall
      description: Uninstall SSH
      descriptionDE: "SSH deinstallieren"
      descriptionES: "Desinstalar SSH"
      descriptionIT: "Disinstalla SSH"
      descriptionFR: "Désinstaller SSH"
    - name: config
      parameter: config
      description: Configure SSH daemon with comprehensive options
      descriptionDE: "SSH-Dienst umfassend konfigurieren"
      descriptionES: "Configurar el servicio SSH en detalle"
      descriptionIT: "Configura il servizio SSH in dettaglio"
      descriptionFR: "Configurer le service SSH en détail"
      prompts:
      - question: '[NETWORK] SSH listening port? (default: 22)'
        questionDE: "[NETZWERK] Auf welchem Port soll SSH lauschen? (Standard: 22)"
        questionES: "[RED] ¿Puerto de escucha de SSH? (por defecto: 22)"
        questionIT: "[RETE] Porta di ascolto SSH? (predefinito: 22)"
        questionFR: "[RÉSEAU] Port d'écoute SSH ? (par défaut : 22)"
        variable: SSH_PORT
        type: number
        default: '22'
      - question: '[NETWORK] Listen on IPv4 address? (0.0.0.0 for all, or specific
          IP)'
        questionDE: "[NETZWERK] Auf welcher IPv4-Adresse lauschen? (0.0.0.0 für alle oder eine bestimmte IP)"
        questionES: "[RED] ¿Dirección IPv4 de escucha? (0.0.0.0 para todas o una IP concreta)"
        questionIT: "[RETE] Indirizzo IPv4 di ascolto? (0.0.0.0 per tutti o un IP specifico)"
        questionFR: "[RÉSEAU] Adresse IPv4 d'écoute ? (0.0.0.0 pour toutes ou une IP précise)"
        variable: LISTEN_IPv4
        type: text
        default: 0.0.0.0
      - question: '[NETWORK] Listen on IPv6 address? (:: for all, or specific IP,
          empty to disable)'
        questionDE: "[NETZWERK] Auf welcher IPv6-Adresse lauschen? (:: für alle, eine bestimmte IP oder leer zum Deaktivieren)"
        questionES: "[RED] ¿Dirección IPv6 de escucha? (:: para todas, una IP concreta o vacío para desactivar)"
        questionIT: "[RETE] Indirizzo IPv6 di ascolto? (:: per tutti, un IP specifico o vuoto per disattivare)"
        questionFR: "[RÉSEAU] Adresse IPv6 d'écoute ? (:: pour toutes, une IP précise ou vide pour désactiver)"
        variable: LISTEN_IPv6
        type: text
        default: '::'
      - question: '[NETWORK] SSH Protocol version? (2 or 1,2, default: 2)'
        questionDE: "[NETZWERK] SSH-Protokollversion? (2 oder 1,2, Standard: 2)"
        questionES: "[RED] ¿Versión del protocolo SSH? (2 o 1,2, por defecto: 2)"
        questionIT: "[RETE] Versione del protocollo SSH? (2 o 1,2, predefinito: 2)"
        questionFR: "[RÉSEAU] Version du protocole SSH ? (2 ou 1,2, par défaut : 2)"
        variable: SSH_PROTOCOL
        type: text
        default: '2'
      - question: '[NETWORK] TCP Keep Alive? (yes/no, default: yes)'
        questionDE: "[NETZWERK] TCP-Keep-Alive nutzen? (yes/no, Standard: yes)"
        questionES: "[RED] ¿Usar TCP Keep Alive? (yes/no, por defecto: yes)"
        questionIT: "[RETE] Usare TCP Keep Alive? (yes/no, predefinito: yes)"
        questionFR: "[RÉSEAU] Utiliser TCP Keep Alive ? (yes/no, par défaut : yes)"
        variable: TCP_KEEPALIVE
        type: yes/no
        default: 'yes'
      - question: '[NETWORK] Address family? (inet/inet6/any, default: any)'
        questionDE: "[NETZWERK] Adressfamilie? (inet/inet6/any, Standard: any)"
        questionES: "[RED] ¿Familia de direcciones? (inet/inet6/any, por defecto: any)"
        questionIT: "[RETE] Famiglia di indirizzi? (inet/inet6/any, predefinito: any)"
        questionFR: "[RÉSEAU] Famille d'adresses ? (inet/inet6/any, par défaut : any)"
        variable: ADDRESS_FAMILY
        type: text
        default: any
      - question: '[AUTH] Password Authentication? (yes/no, default: yes)'
        questionDE: "[ANMELDUNG] Anmeldung per Passwort erlauben? (yes/no, Standard: yes)"
        questionES: "[ACCESO] ¿Permitir el acceso con contraseña? (yes/no, por defecto: yes)"
        questionIT: "[ACCESSO] Consentire l'accesso con password? (yes/no, predefinito: yes)"
        questionFR: "[CONNEXION] Autoriser la connexion par mot de passe ? (yes/no, par défaut : yes)"
        variable: PASS_AUTH
        type: yes/no
        default: 'yes'
      - question: '[AUTH] Public Key Authentication? (yes/no, default: yes)'
        questionDE: "[ANMELDUNG] Anmeldung per öffentlichem Schlüssel erlauben? (yes/no, Standard: yes)"
        questionES: "[ACCESO] ¿Permitir el acceso con clave pública? (yes/no, por defecto: yes)"
        questionIT: "[ACCESSO] Consentire l'accesso con chiave pubblica? (yes/no, predefinito: yes)"
        questionFR: "[CONNEXION] Autoriser la connexion par clé publique ? (yes/no, par défaut : yes)"
        variable: PUBKEY_AUTH
        type: yes/no
        default: 'yes'
      - question: '[AUTH] Kerberos Authentication? (yes/no, default: no)'
        questionDE: "[ANMELDUNG] Anmeldung per Kerberos erlauben? (yes/no, Standard: no)"
        questionES: "[ACCESO] ¿Permitir el acceso con Kerberos? (yes/no, por defecto: no)"
        questionIT: "[ACCESSO] Consentire l'accesso con Kerberos? (yes/no, predefinito: no)"
        questionFR: "[CONNEXION] Autoriser la connexion par Kerberos ? (yes/no, par défaut : no)"
        variable: KERBEROS_AUTH
        type: yes/no
        default: 'no'
      - question: '[AUTH] GSSAPI Authentication? (yes/no, default: no)'
        questionDE: "[ANMELDUNG] Anmeldung per GSSAPI erlauben? (yes/no, Standard: no)"
        questionES: "[ACCESO] ¿Permitir el acceso con GSSAPI? (yes/no, por defecto: no)"
        questionIT: "[ACCESSO] Consentire l'accesso con GSSAPI? (yes/no, predefinito: no)"
        questionFR: "[CONNEXION] Autoriser la connexion par GSSAPI ? (yes/no, par défaut : no)"
        variable: GSSAPI_AUTH
        type: yes/no
        default: 'no'
      - question: '[AUTH] Use PAM? (yes/no, default: yes)'
        questionDE: "[ANMELDUNG] PAM nutzen? (yes/no, Standard: yes)"
        questionES: "[ACCESO] ¿Usar PAM? (yes/no, por defecto: yes)"
        questionIT: "[ACCESSO] Usare PAM? (yes/no, predefinito: yes)"
        questionFR: "[CONNEXION] Utiliser PAM ? (yes/no, par défaut : yes)"
        variable: USE_PAM
        type: yes/no
        default: 'yes'
      - question: '[AUTH] Authentication methods? (password/publickey/etc, empty for
