# ulh catalog - every entry of the ulh menu. Paths below are from the ulh folder.
#
# Each entry runs apps/cli/assets/scripts/<file> with one parameter:
# "action,VAR1=value1,VAR2=value2". New script: copy
# apps/cli/templates/script-template.sh. Fields and prompt types: docs/guide.md.
#
# Your own scripts do not belong here: updates replace this file. Put them into
# a repository of your own, see apps/cli/config/repo.yaml.
#
# Languages: description, question and the category names are English. The
# translations sit right below them, the language as suffix: descriptionDE,
# descriptionES, descriptionIT, descriptionFR - the same for question and, in
# categories, for name. A missing translation shows the English text.

